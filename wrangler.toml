name = "shop-catalog-template"
main = "worker.js"
compatibility_date = "2026-01-01"

# ‼️ نکته: id خالی عمداً همین‌طور مانده — این دقیقاً چیزی است که دکمه‌ی
# «Deploy to Cloudflare» به آن نیاز دارد تا در لحظه‌ی دیپلوی، به‌جای اینکه
# بخواهد یک KV Namespace از قبل موجود را پیدا کند، خودش یک KV Namespace
# تازه در حساب کاربری که روی دکمه کلیک کرده بسازد و بایندش کند. اگر اینجا
# یک id واقعی بگذارید، دیگر ساخت خودکار اتفاق نمی‌افتد (چون آن id مال
# حساب شماست، نه حساب فروشنده). این فایل نباید تغییر کند.
kv_namespaces = [
  { binding = "CATALOG_KV", id = "" }
]

# ‼️ جدید (بخش ۱) — پایگاه‌داده‌ی D1 هر فروشنده. دقیقاً مثل KV بالا،
# database_id عمداً خالی مانده تا دکمه‌ی Deploy خودش یک دیتابیس D1 تازه
# روی حساب فروشنده بسازد. کلید migrations_dir باعث می‌شود Cloudflare
# فایل‌های داخل پوشه‌ی migrations (همان فایلی که در همین بخش ساختیم) را
# به‌صورت خودکار، به‌عنوان بخشی از فرآیند دیپلوی، روی همان دیتابیس تازه
# اجرا کند — یعنی فروشنده هیچ قدم دستی اضافه‌ای برای ساخت جدول‌ها نمی‌بیند.
d1_databases = [
  { binding = "CATALOG_DB", database_name = "shop-catalog-db", database_id = "", migrations_dir = "./migrations" }
]

# ‼️ جدید — بروزرسانی خودکار ساعتی. این خط باعث می‌شود Cloudflare خودش،
# روی حساب هر فروشنده به‌طور مستقل، تابع scheduled() داخل worker.js را
# هر ساعت یک‌بار (در دقیقه‌ی صفر هر ساعت، به وقت UTC) اجرا کند — بدون
# هیچ نیاز به کلیک یا دخالت فروشنده، و بدون اینکه حتی یک ساب‌ریکوئست
# روی حساب Cloudflare من مصرف شود.
[triggers]
crons = ["0 * * * *"]

name = "shop-catalog-template"
main = "worker.js"
compatibility_date = "2026-01-01"

# ‼️ نکته: id خالی عمداً همین‌طور مانده — این دقیقاً چیزی است که دکمه‌ی
# «Deploy to Cloudflare» به آن نیاز دارد تا در لحظه‌ی دیپلوی، به‌جای اینکه
# بخواهد یک KV Namespace از قبل موجود را پیدا کند، خودش یک KV Namespace
# تازه در حساب کاربری که روی دکمه کلیک کرده بسازد و بایندش کند. اگر اینجا
# یک id واقعی بگذارید، دیگر ساخت خودکار اتفاق نمی‌افتد (چون آن id مال
# حساب شماست، نه حساب فروشنده). این فایل نباید تغییر کند.
kv_namespaces = [
  { binding = "CATALOG_KV", id = "" }
]
